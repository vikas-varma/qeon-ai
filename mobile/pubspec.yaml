name: qeonai
version: 0.1.0+1
publish_to: none
description: Qeon AI personal assistant mobile application.

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  dio: ^5.11.0
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.5.5
  google_fonts: ^8.2.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

name: qeonai
version: 0.1.0+1
publish_to: none
description: Qeon AI personal assistant mobile application.

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  dio: ^5.11.0
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.5.5
  google_fonts: ^8.2.0
  url_launcher: ^6.3.2
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/images/qeon_app_icon_v1.png
  adaptive_icon_background: "#210044"
  adaptive_icon_foreground: assets/images/qeon_app_icon_foreground_v1.png
  adaptive_icon_foreground_inset: 18
  min_sdk_android: 24

flutter:
  uses-material-design: true
  assets:
    - assets/images/
